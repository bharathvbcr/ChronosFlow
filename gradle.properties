# Keep app + androidTest APKs on device after connected tests (AGP 8.1+).
# Stops Gemini/Android MCP and Gradle from wiping a manually installed debug build.
android.injected.androidTest.leaveApksInstalledAfterRun=true

# App version — single source of truth for the phone (:app) and watch (:wear) APKs. They share the
# applicationId + signing key so the Wearable Data Layer pairs them, which means Google Play treats
# them as one app and uses Multi-APK delivery: each APK MUST carry a distinct versionCode. :app uses
# this value directly; :wear derives a higher code in a reserved band (+100000) so the two never
# collide as the version increments, and Play routes the watch APK to watches by its
# android.hardware.type.watch feature.
chronos.versionCode=1
chronos.versionName=0.1.0

android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=37.0
kotlin.code.style=official
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.parallel=false
org.gradle.workers.max=1
ksp.incremental=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
android.r8.strictFullModeForKeepRules=false
