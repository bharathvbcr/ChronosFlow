name: Android checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  non-emulator-checks:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: pwsh
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0" "platform-tools"

      - name: Enforce DAY_DIAL constants ownership
        shell: pwsh
        run: |
          $matches = rg -n --glob "*.kt" --glob "!**/build/**" --glob "!**/.gradle/**" "const val\s+DAY_DIAL_" .\app .\core .\feature .\wear .\scripts 2>$null
          $violations = $matches | Where-Object { $_ -notlike "*DayDialMotion.kt*" }
          if ($violations) {
            Write-Host "DAY_DIAL_* constants must be defined only in DayDialMotion.kt"
            Write-Host $violations
            exit 1
          }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run ChronosFlow CI checks
        shell: pwsh
        run: .\gradlew.bat chronosCiCheck --console=plain --no-daemon
