name: iOS

# Builds the native iOS/watchOS SwiftUI port. The full apps link Apple frameworks (SwiftUI,
# SwiftData, FoundationModels, ActivityKit, WidgetKit, HealthKit, WatchConnectivity, LocalAuthentication)
# and therefore can only be built on macOS; this is the real `xcodebuild` step the apps need. The
# portable logic core is also built/tested on every push (it compiles on any platform).

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build-app:
    name: Build app + watch + widgets (xcodebuild, macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode (iOS 27 SDK)
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer"

      - name: Install XcodeGen + xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Generate project (app + widgets + watch + watch widgets)
        working-directory: ios
        run: xcodegen generate

      - name: Resolve Swift packages (ChronosCore)
        working-directory: ios
        run: xcodebuild -resolvePackageDependencies -project ChronosFlow.xcodeproj

      # Building the iOS app scheme also builds its embedded extensions/targets (the iOS widget
      # extension + the embedded watch app, which in turn embeds the watch widget extension).
      - name: Build iOS app for the Simulator
        working-directory: ios
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          xcodebuild \
            -project ChronosFlow.xcodeproj \
            -scheme ChronosFlow \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEST" \
            CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify

      # Build the watchOS app target explicitly so the watch app + watch widget extension are
      # verified directly (an iOS-Simulator destination can't build watchOS code on its own).
      - name: Build watchOS app for the Simulator
        working-directory: ios
        run: |
          set -o pipefail
          WDEST=$(xcrun simctl list devices available | grep -m1 "Apple Watch" | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          xcodebuild \
            -project ChronosFlow.xcodeproj \
            -scheme ChronosWatch \
            -configuration Debug \
            -destination "platform=watchOS Simulator,id=$WDEST" \
            CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify

  build-core:
    name: Build + test portable core (any OS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - name: swift build
        working-directory: ios/ChronosCore
        run: swift build -v
      - name: swift test (29 logic modules)
        working-directory: ios/ChronosCore
        run: swift test -v
